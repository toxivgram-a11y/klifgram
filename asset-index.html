<!doctype html><meta charset="utf-8"><title>Gift asset index</title><style>body{font:12px Arial;background:#15202b;color:#fff;margin:16px}.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}.card{background:#202d38;padding:6px;min-width:0}.card img{width:100%;height:110px;object-fit:contain;background:#17222c}.card small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:5px}@media(max-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:500px){.grid{grid-template-columns:repeat(2,1fr)}}</style><h1>Gift assets</h1><div class="grid" id="grid">Loading...</div><script>fetch('https://api.github.com/repos/denzyve/cdn-telegram-gifts/git/trees/main?recursive=1').then(r=>r.json()).then(data=>{const ids=data.tree.filter(x=>x.path.startsWith('assets/webp/')).map(x=>x.path.split('/').pop().replace('gift_','').replace('.webp',''));grid.innerHTML=ids.map((id,i)=>`<div class="card"><img src="https://raw.githubusercontent.com/denzyve/cdn-telegram-gifts/main/assets/webp/gift_${id}.webp"><small>${i}: ${id}</small></div>`).join('')})</script>
